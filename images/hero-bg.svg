<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2a44"/><stop offset="1" stop-color="#0e1626"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d5fa8"/><stop offset=".6" stop-color="#6b7fc4"/><stop offset="1" stop-color="#f0a873"/></linearGradient>
    <radialGradient id="glow" r=".5"><stop offset="0" stop-color="#ffd59a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd59a" stop-opacity="0"/></radialGradient>
    <radialGradient id="cyan" r=".5"><stop offset="0" stop-color="#3fd0f0" stop-opacity=".55"/><stop offset="1" stop-color="#3fd0f0" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#wall)"/>
  <!-- window with city -->
  <rect x="980" y="120" width="460" height="520" rx="6" fill="url(#sky)"/>
  <g fill="#14203a" opacity=".9">
    <rect x="990" y="430" width="60" height="210"/><rect x="1060" y="380" width="50" height="260"/><rect x="1120" y="460" width="80" height="180"/>
    <rect x="1210" y="350" width="55" height="290"/><rect x="1275" y="420" width="70" height="220"/><rect x="1355" y="470" width="75" height="170"/>
  </g>
  <g fill="#ffd27a" opacity=".8">
    <rect x="1072" y="400" width="8" height="8"/><rect x="1090" y="430" width="8" height="8"/><rect x="1222" y="380" width="8" height="8"/><rect x="1240" y="420" width="8" height="8"/>
    <rect x="1290" y="450" width="8" height="8"/><rect x="1310" y="490" width="8" height="8"/><rect x="1135" y="490" width="8" height="8"/><rect x="1370" y="500" width="8" height="8"/>
  </g>
  <rect x="980" y="120" width="460" height="520" rx="6" fill="none" stroke="#0a111e" stroke-width="14"/>
  <line x1="1210" y1="120" x2="1210" y2="640" stroke="#0a111e" stroke-width="10"/>
  <!-- curtains -->
  <path d="M940 90 h70 c-10 200 10 400 -10 600 h-60 z" fill="#2a3a5c"/>
  <path d="M1410 90 h70 v600 h-60 c-20 -200 0 -400 -10 -600 z" fill="#2a3a5c"/>
  <!-- pendant lights -->
  <g stroke="#0a111e" stroke-width="3"><line x1="380" y1="0" x2="380" y2="210"/><line x1="560" y1="0" x2="560" y2="260"/><line x1="740" y1="0" x2="740" y2="200"/></g>
  <circle cx="380" cy="250" r="160" fill="url(#glow)"/><circle cx="560" cy="300" r="180" fill="url(#glow)"/><circle cx="740" cy="240" r="150" fill="url(#glow)"/>
  <g fill="#0a111e"><path d="M350 210 h60 l14 34 h-88z"/><path d="M528 260 h64 l16 38 h-96z"/><path d="M712 200 h56 l12 32 h-80z"/></g>
  <g fill="#ffe2b0"><ellipse cx="380" cy="246" rx="34" ry="5"/><ellipse cx="560" cy="300" rx="40" ry="6"/><ellipse cx="740" cy="234" rx="30" ry="5"/></g>
  <!-- wall switch panel -->
  <circle cx="200" cy="470" r="120" fill="url(#cyan)"/>
  <rect x="160" y="420" width="80" height="100" rx="10" fill="#0a111e" stroke="#3a4f75" stroke-width="2"/>
  <g fill="#3fd0f0"><circle cx="185" cy="450" r="5"/><circle cx="215" cy="450" r="5"/><circle cx="185" cy="490" r="5"/><circle cx="215" cy="490" r="5" opacity=".4"/></g>
  <!-- floor + sofa -->
  <rect y="700" width="1600" height="200" fill="#0b121f"/>
  <path d="M260 600 q0 -40 40 -40 h560 q40 0 40 40 v110 h-640z" fill="#33476b"/>
  <rect x="230" y="640" width="700" height="90" rx="26" fill="#3d5580"/>
  <rect x="280" y="730" width="18" height="40" fill="#0a111e"/><rect x="862" y="730" width="18" height="40" fill="#0a111e"/>
  <rect x="320" y="590" width="120" height="70" rx="18" fill="#4f6a9a"/><rect x="720" y="590" width="120" height="70" rx="18" fill="#4f6a9a"/>
  <!-- floor lamp glow -->
  <circle cx="1530" cy="760" r="200" fill="url(#glow)" opacity=".5"/>
</svg>
